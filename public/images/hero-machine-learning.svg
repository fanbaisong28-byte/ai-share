<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0edfe"/>
      <stop offset="100%" style="stop-color:#fce7f3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg5)" rx="12"/>
  <!-- Neural network -->
  <circle cx="600" cy="130" r="15" fill="#5b4cdb" opacity="0.2"/>
  <circle cx="550" cy="170" r="12" fill="#5b4cdb" opacity="0.15"/>
  <circle cx="650" cy="170" r="12" fill="#5b4cdb" opacity="0.15"/>
  <circle cx="580" cy="210" r="10" fill="#5b4cdb" opacity="0.1"/>
  <circle cx="620" cy="210" r="10" fill="#5b4cdb" opacity="0.1"/>
  <circle cx="560" cy="250" r="8" fill="#059669" opacity="0.1"/>
  <circle cx="600" cy="250" r="8" fill="#059669" opacity="0.1"/>
  <circle cx="640" cy="250" r="8" fill="#059669" opacity="0.1"/>
  <!-- Lines connecting neurons -->
  <line x1="600" y1="130" x2="550" y2="170" stroke="#5b4cdb" stroke-width="1" opacity="0.15"/>
  <line x1="600" y1="130" x2="650" y2="170" stroke="#5b4cdb" stroke-width="1" opacity="0.15"/>
  <line x1="550" y1="170" x2="580" y2="210" stroke="#5b4cdb" stroke-width="1" opacity="0.12"/>
  <line x1="550" y1="170" x2="620" y2="210" stroke="#5b4cdb" stroke-width="1" opacity="0.12"/>
  <line x1="650" y1="170" x2="580" y2="210" stroke="#5b4cdb" stroke-width="1" opacity="0.12"/>
  <line x1="650" y1="170" x2="620" y2="210" stroke="#5b4cdb" stroke-width="1" opacity="0.12"/>
  <line x1="580" y1="210" x2="560" y2="250" stroke="#059669" stroke-width="1" opacity="0.1"/>
  <line x1="580" y1="210" x2="600" y2="250" stroke="#059669" stroke-width="1" opacity="0.1"/>
  <line x1="620" y1="210" x2="600" y2="250" stroke="#059669" stroke-width="1" opacity="0.1"/>
  <line x1="620" y1="210" x2="640" y2="250" stroke="#059669" stroke-width="1" opacity="0.1"/>
  <!-- Text -->
  <text x="80" y="160" font-family="Arial,sans-serif" font-weight="700" font-size="42" fill="#1a1a1a">机器学习入门</text>
  <text x="80" y="210" font-family="Arial,sans-serif" font-weight="400" font-size="20" fill="#555">从零开始理解 AI 核心概念</text>
  <text x="80" y="280" font-family="Arial,sans-serif" font-weight="600" font-size="16" fill="#5b4cdb"># 神经网络 # 深度学习 # 自然语言处理</text>
</svg>