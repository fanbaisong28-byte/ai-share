<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0edfe"/>
      <stop offset="100%" style="stop-color:#d1fae5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" rx="16" fill="url(#bg4)"/>
  <!-- HTML icon -->
  <rect x="50" y="60" width="70" height="80" rx="8" fill="white" opacity="0.7"/>
  <text x="68" y="105" font-family="Arial,sans-serif" font-weight="700" font-size="20" fill="#e44d26">&lt;/&gt;</text>
  <text x="60" y="130" font-family="Arial,sans-serif" font-weight="600" font-size="10" fill="#555">HTML5</text>
  <!-- CSS icon -->
  <rect x="165" y="60" width="70" height="80" rx="8" fill="white" opacity="0.7"/>
  <text x="186" y="105" font-family="Arial,sans-serif" font-weight="700" font-size="28" fill="#264de4">#</text>
  <text x="177" y="130" font-family="Arial,sans-serif" font-weight="600" font-size="10" fill="#555">CSS3</text>
  <!-- Vue icon -->
  <rect x="280" y="60" width="70" height="80" rx="8" fill="white" opacity="0.7"/>
  <text x="295" y="105" font-family="Arial,sans-serif" font-weight="700" font-size="22" fill="#4fc08d">Vue</text>
  <text x="297" y="130" font-family="Arial,sans-serif" font-weight="600" font-size="10" fill="#555">Vue 3</text>
  <!-- Connection lines -->
  <line x1="120" y1="100" x2="165" y2="100" stroke="#5b4cdb" stroke-width="1.5" stroke-dasharray="4" opacity="0.3"/>
  <line x1="235" y1="100" x2="280" y2="100" stroke="#5b4cdb" stroke-width="1.5" stroke-dasharray="4" opacity="0.3"/>
  <!-- Bottom text -->
  <text x="105" y="200" font-family="Arial,sans-serif" font-weight="600" font-size="15" fill="#5b4cdb">HTML + CSS + Vue 3</text>
  <text x="125" y="222" font-family="Arial,sans-serif" font-size="12" fill="#888">前端技术博客</text>
</svg>